name: Apple

on:
  pull_request:
    paths:
      - "apps/apple/**"
      - "packages/convex/convex/**"
      - "packages/convex/fixtures/**"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]
    paths:
      - "apps/apple/**"
      - "packages/convex/convex/**"
      - "packages/convex/fixtures/**"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Xcode 27 runner image (public preview).
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: xcodebuild -version
      - name: Lint
        run: bun run lint
      - name: Build for iOS and macOS
        run: bun run build
      - name: Test (NeramKit + iOS UI tests)
        run: bun run test
