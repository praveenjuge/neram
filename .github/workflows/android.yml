name: Android

# A fast check for Android changes: formatting only, well under two minutes.
# Unit tests compile the whole app (about three minutes on a fresh runner), so
# they run locally with `bun run test` instead, along with lint.
on:
  pull_request:
    paths:
      - "apps/android/**"
      - "packages/convex/fixtures/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Format
        run: ./gradlew ktfmtCheck
